name: Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.ai/**'
      - '.claude/**'
      - '.idea/**'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    name: Tag the next patch release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "HEAD is already tagged, nothing to release"
            exit 0
          fi

          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          IFS=. read -r major minor patch <<< "${latest#v}"
          title=$(git log -1 --format='%s%n%b' | head -n 2)

          if grep -qF '[major]' <<< "$title"; then
            next="v$((major + 1)).0.0"
          elif grep -qF '[minor]' <<< "$title"; then
            next="v${major}.$((minor + 1)).0"
          else
            next="v${major}.${minor}.$((patch + 1))"
          fi

          gh release create "$next" --target "$GITHUB_SHA" --generate-notes
