name: Tests

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '12'
            testbench: '^10.0'
          - php: '8.5'
            laravel: '13'
            testbench: '^11.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies for Laravel ${{ matrix.laravel }}
        run: |
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --no-interaction --no-progress --prefer-dist --with-all-dependencies

      - name: Run tests
        run: vendor/bin/phpunit
